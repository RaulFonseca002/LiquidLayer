id: bulk_probe
name: "Bulk probe (rebuild instrument)"
category: connectivity
interface: gpio
size: 1
description: |
  Rebuild-ladder instrument. A global object with the same static footprint and
  member constructors as the old sensing module (16 x 1 KB ring, DSP buffers,
  WiFiUDP, Preferences) that never does anything. Tests whether large statics /
  global constructors break the display after a warm reset.
driver: {header: bulk_probe.h, source: bulk_probe.cpp, class_name: BulkProbe}
templates:
  globals: |
    BulkProbe {{ instance }};
  setup: |
    {{ instance }}.begin();
  loop: |
    {{ instance }}.update();
events: []
actions: []
lib_deps: []
usage: |
  // BulkProbe does nothing. footprintKB() reports its static size.
  uint32_t kb = {{ instance }}.footprintKB();
