id: ruview_csi
name: "RuView WiFi CSI sensing"
category: connectivity
interface: gpio
size: 1
description: |
  Turns the board's own WiFi radio into a RuView-compatible Channel State
  Information (CSI) sensing node. Joins a 2.4 GHz network, captures CSI on
  received management frames, streams ADR-018 frames (magic 0xC5110001) to a
  RuView sink over UDP, and exposes an on-device activity/presence estimate.
  Uses no wires: it only occupies a port slot. Credentials live in NVS and are
  written over USB with the set_wifi / set_sink actions, never in the firmware.
  Ported from github.com/ruvnet/RuView firmware/esp32-csi-node (MIT).

driver:
  header: ruview_csi.h
  source: ruview_csi.cpp
  class_name: RuViewCsi

templates:
  globals: |
    RuViewCsi {{ instance }}("{{ instance }}");
  setup: |
    {{ instance }}.begin();
  loop: |
    {{ instance }}.update();
    {
      char ev[192];
      if ({{ instance }}.nextEvent(ev, sizeof ev)) Serial.println(ev);
    }

events:
  - key: frame_rate
    type: sensor
    value_type: float
    unit: Hz
    description: "CSI frames per second reaching the DSP (target >= 15)."
  - key: rssi
    type: sensor
    value_type: int
    unit: dBm
    description: "RSSI of the last CSI frame."
  - key: activity
    type: sensor
    value_type: float
    description: "Motion energy: EMA of mean subcarrier amplitude change between frames (0 = still room)."
  - key: presence
    type: state
    value_type: int
    description: "1 when activity exceeds the ambient threshold learned in the first 10 s."
  - key: link
    type: state
    value_type: string
    description: "unconfigured | connecting | streaming | lost"

actions:
  - key: "{{ instance }}_set_wifi"
    value_type: json
    description: 'Object {"ssid": "...", "pass": "..."} stored in NVS; reconnects immediately.'
  - key: "{{ instance }}_set_sink"
    value_type: json
    description: 'Object {"ip": "192.168.1.20", "port": 5005, "node_id": 1} RuView aggregator; stored in NVS.'
  - key: "{{ instance }}_scan"
    value_type: "null"
    description: "Scan 2.4 GHz networks; each SSID is reported as a log event (RSSI, channel, security)."
  - key: "{{ instance }}_diag"
    value_type: "null"
    description: "Report frame/drop/tx counters, rate, IP, gateway, sink, heap as log events."
  - key: "{{ instance }}_promisc"
    value_type: int
    description: "0 = CSI from frames addressed to this station (default; the only mode that works on the Arduino core), 1 = MGMT promiscuous (experimental)."
  - key: "{{ instance }}_probe"
    value_type: int
    description: "Probe-request injection: -1 auto (default), 0 off, 1 on."
  - key: "{{ instance }}_calibrate"
    value_type: "null"
    description: "Relearn the ambient activity threshold (10 s)."
  - key: "{{ instance }}_stream"
    value_type: int
    description: "1 = send ADR-018 CSI frames to the sink, 0 = stop (default 1)."

lib_deps: []

usage: |
  // Public API of RuViewCsi — the instance is `{{ instance }}`.
  // begin() already ran in setup(); update() and the 1 Hz events run in the
  // module template every loop. Credentials come from NVS, written over USB:
  //   atech send {{ instance }}_set_wifi '{"ssid":"MyWiFi","pass":"secret"}'
  //   atech send {{ instance }}_set_sink '{"ip":"192.168.1.20","port":5005}'
  const char* s = {{ instance }}.stateName();      // "unconfigured" | "connecting" | "streaming" | "lost"
  bool up      = {{ instance }}.isConnected();     // WiFi associated
  float hz     = {{ instance }}.frameRateHz();     // CSI frames/s (aim for >= 15)
  int   rssi   = {{ instance }}.rssi();            // dBm of last frame
  float act    = {{ instance }}.activity();        // motion energy, 0 = still
  bool  here   = {{ instance }}.presence();        // activity above learned ambient
  bool  cal    = {{ instance }}.isCalibrating();   // first 10 s after (re)connect
  uint32_t n   = {{ instance }}.framesTotal();     // frames since boot
  uint32_t tx  = {{ instance }}.packetsSent();     // UDP packets to the sink
  const char* ip = {{ instance }}.sinkIp();        // configured sink
  {{ instance }}.calibrate();                      // relearn ambient threshold
  {{ instance }}.setStreaming(true);               // ADR-018 UDP on/off
  // Never call display code from anything but loop(); update() is cheap.
