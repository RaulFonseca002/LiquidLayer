# Liquid node — ground-up rebuild v2 (see ../../STAGES.md).
# RUNG L1: L0 + Serial.println("tick") every 200 ms. Nothing else. Loop watchdog, RTC boot counter + boot card,
# NeoPixel loop heartbeat (off-panel liveness), reset reason on screen.
# The ONLY change vs L0 is the paced serial print below.
name: liquid-node
board: 14port
modules_path: ../../modules
modules:
  - {id: st7735_tft, instance: tftA, ports: [1, 2]}
  - {id: neopixel,   instance: led,  port: 10}
code:
  setup: |
    // --- instrumentation -------------------------------------------------
    // A hung loop() reboots the board after 5 s (reset reason 6 on screen,
    // splash flicker to the eye).
    enableLoopWDT();
    // Boot counter in RTC slow memory: survives warm resets, not power loss.
    static RTC_DATA_ATTR uint32_t bootMagic;
    static RTC_DATA_ATTR uint32_t bootCount;
    bool coldBoot = (bootMagic != 0xB007C0DEu);
    if (coldBoot) { bootMagic = 0xB007C0DEu; bootCount = 0; }
    bootCount++;

    // --- panel warm-reset hygiene (S0) ------------------------------------
    pinMode(4, OUTPUT); digitalWrite(4, HIGH);
    pinMode(5, OUTPUT); digitalWrite(5, HIGH);
    pinMode(8, OUTPUT); digitalWrite(8, LOW);
    pinMode(9, OUTPUT); digitalWrite(9, LOW);
    delay(50);
    tftA.clear(); tftA.display();
    delay(100);

    // --- boot card: 2 s, so the owner can read it after each press ---------
    tftA.clear();
    tftA.displayText("L1 boot card", 2, 2, 1, ST7735_TFT::COLOR_CYAN);
    char line[40];
    snprintf(line, sizeof line, "boot #%lu  %s", (unsigned long)bootCount, coldBoot ? "rtc cleared" : "rtc kept");
    tftA.displayText(line, 2, 16, 2, coldBoot ? ST7735_TFT::COLOR_ORANGE : ST7735_TFT::COLOR_WHITE);
    snprintf(line, sizeof line, "reason %d  heap %luK", (int)esp_reset_reason(), (unsigned long)(ESP.getFreeHeap() / 1024));
    tftA.displayText(line, 2, 40, 1, ST7735_TFT::COLOR_YELLOW);
    snprintf(line, sizeof line, "sketch %luK", (unsigned long)(ESP.getSketchSize() / 1024));
    tftA.displayText(line, 2, 54, 1, ST7735_TFT::COLOR_YELLOW);
    tftA.display();
    delay(2000);
    led.setBrightness(30);
  loop: |
    // L1 probe: one short line to USB serial every 200 ms, exactly like a
    // module's paced event stream. Nothing reads it unless a host is attached.
    static uint32_t lastTick = 0;
    if (millis() - lastTick >= 200) { lastTick = millis(); Serial.println("tick"); }

    // render() at 2 Hz is the ONLY thing that touches the panel; the NeoPixel
    // blink right after it is the off-panel loop heartbeat.
    static uint32_t lastDraw = 0;
    if (millis() - lastDraw < 500) return;
    lastDraw = millis();
    static uint32_t frames = 0; frames++;
    static bool hb = false; hb = !hb;

    tftA.clear();
    tftA.displayText("L1  + serial tick", 2, 2, 1, ST7735_TFT::COLOR_CYAN);
    char line[40];
    snprintf(line, sizeof line, "frame %lu", (unsigned long)frames);
    tftA.displayText(line, 2, 18, 2, ST7735_TFT::COLOR_WHITE);
    snprintf(line, sizeof line, "up %lus  reset %d", (unsigned long)(millis() / 1000), (int)esp_reset_reason());
    tftA.displayText(line, 2, 44, 1, ST7735_TFT::COLOR_YELLOW);
    tftA.displayText("heartbeat ->", 76, 66, 1, 0x8410);
    tftA.fillRect(154, 74, 6, 6, hb ? ST7735_TFT::COLOR_YELLOW : 0x2104);
    tftA.display();

    // off-panel loop heartbeat: centre pixel blinks in step with the square
    led.clear();
    if (hb) led.setPixel(4, 0, 40, 0);
    led.show();
