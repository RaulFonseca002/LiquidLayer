# Liquid node — rebuilt stage by stage (see ../../STAGES.md).
# STAGE S0: bare display. Nothing else is added until S0 survives two warm
# resets (board reset button) with the heartbeat alive for 60 s each.
name: liquid-node
board: 14port
modules_path: ../../modules
modules:
  - {id: st7735_tft, instance: tftA, ports: [1, 2]}
code:
  setup: |
    // Panel warm-reset hygiene. A chip reset does not reset the panel (its
    // reset line is not wired to the chip), so after a warm reset the panel
    // may sit in a half-finished transaction. Park the bus lines, then paint
    // two full black frames to force a clean state before the first real frame.
    // Pins for tftA on ports 1+2: sclk 8, cs 4, mosi 9, dc 5 (see generated main.cpp).
    pinMode(4, OUTPUT); digitalWrite(4, HIGH);   // CS idle high
    pinMode(5, OUTPUT); digitalWrite(5, HIGH);   // DC data
    pinMode(8, OUTPUT); digitalWrite(8, LOW);    // SCLK idle low
    pinMode(9, OUTPUT); digitalWrite(9, LOW);    // MOSI low
    delay(50);
    tftA.clear(); tftA.display();
    delay(100);
    tftA.clear(); tftA.display();
  loop: |
    // render() at 2 Hz is the ONLY thing that touches the panel.
    static uint32_t lastDraw = 0;
    if (millis() - lastDraw < 500) return;
    lastDraw = millis();
    static uint32_t frames = 0; frames++;
    static bool hb = false; hb = !hb;

    tftA.clear();
    tftA.displayText("S0  display only", 2, 2, 1, ST7735_TFT::COLOR_CYAN);
    char line[40];
    snprintf(line, sizeof line, "frame %lu", (unsigned long)frames);
    tftA.displayText(line, 2, 18, 2, ST7735_TFT::COLOR_WHITE);
    snprintf(line, sizeof line, "up %lus  reset %d", (unsigned long)(millis() / 1000), (int)esp_reset_reason());
    tftA.displayText(line, 2, 44, 1, ST7735_TFT::COLOR_YELLOW);
    tftA.displayText("heartbeat ->", 76, 66, 1, 0x8410);
    tftA.fillRect(154, 74, 6, 6, hb ? ST7735_TFT::COLOR_YELLOW : 0x2104);
    tftA.display();
